<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D3 Projection Comparison Test</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
      background: #F3F4F6;
    }
    .test-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .map-card {
      background: #FFFFFF;
      border: 1px solid #D1D5DB;
      border-radius: 8px;
      padding: 12px;
    }
    .map-box {
      width: 100%;
      height: 380px;
      background: #EAECEF;
      border: 1px solid #E5E7EB;
    }
    svg {
      width: 100%;
      height: 100%;
    }
    .country-path {
      fill: #9CA3AF;
      stroke: #FFFFFF;
      stroke-width: 0.8px;
    }
    .country-path:hover {
      fill: #4B5563;
    }
  </style>
</head>
<body>
  <h2>D3 Geographic Projection Comparison</h2>
  <div class="test-grid">
    
    <!-- Option 1: Standard Natural Earth 1 -->
    <div class="map-card">
      <h3>1. Natural Earth 1 (scale 160, translate [w/2, h/1.7])</h3>
      <div id="map-ne" class="map-box"></div>
    </div>

    <!-- Option 2: Standard Mercator -->
    <div class="map-card">
      <h3>2. Mercator (scale 130, translate [w/2, h/1.5])</h3>
      <div id="map-mercator" class="map-box"></div>
    </div>

    <!-- Option 3: Equirectangular Standard -->
    <div class="map-card">
      <h3>3. Equirectangular (scale 140, translate [w/2, h/2])</h3>
      <div id="map-equi" class="map-box"></div>
    </div>

    <!-- Option 4: FitExtent without Antarctica -->
    <div class="map-card">
      <h3>4. FitExtent (Excl. Antarctica)</h3>
      <div id="map-fit" class="map-box"></div>
    </div>

  </div>

  <script>
    async function runProjectionTests() {
      const response = await fetch('countries-10m.json');
      const topoData = await response.json();
      const geoCountries = topojson.feature(topoData, topoData.objects.countries).features;
      const noAntarctica = geoCountries.filter(d => d.id !== '010');

      function renderTest(containerId, projection) {
        const container = document.getElementById(containerId);
        const w = container.clientWidth || 600;
        const h = container.clientHeight || 380;

        const svg = d3.select(container)
          .append('svg')
          .attr('viewBox', `0 0 ${w} ${h}`)
          .attr('preserveAspectRatio', 'xMidYMid meet');

        const pathGen = d3.geoPath().projection(projection);

        svg.selectAll('.country-path')
          .data(geoCountries)
          .enter()
          .append('path')
          .attr('class', 'country-path')
          .attr('d', pathGen);
      }

      // 1. Natural Earth
      const container1 = document.getElementById('map-ne');
      const w1 = container1.clientWidth || 600;
      const h1 = container1.clientHeight || 380;
      const projNE = d3.geoNaturalEarth1()
        .scale(w1 / 5.2)
        .translate([w1 / 2, h1 / 1.8]);
      renderTest('map-ne', projNE);

      // 2. Mercator
      const projMerc = d3.geoMercator()
        .scale(w1 / 6.5)
        .translate([w1 / 2, h1 / 1.45]);
      renderTest('map-mercator', projMerc);

      // 3. Equirectangular
      const projEqui = d3.geoEquirectangular()
        .scale(w1 / 5.8)
        .translate([w1 / 2, h1 / 2]);
      renderTest('map-equi', projEqui);

      // 4. FitExtent (excluding Antarctica)
      const projFit = d3.geoMercator()
        .fitExtent([[10, 10], [w1 - 10, h1 - 10]], {
          type: 'FeatureCollection',
          features: noAntarctica
        });
      renderTest('map-fit', projFit);
    }

    runProjectionTests();
  </script>
</body>
</html>
